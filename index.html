<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Endereços - SENAI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #0056b3; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        button:hover { background-color: #004085; }
        table { width: 100%; margin-top: 30px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #bd2130; }
    </style>
</head>
<body>

<div class="container">
    <h2>📍 Cadastro de Endereço</h2>
    
    <div class="form-group">
        <label for="cep">Digite o CEP (Apenas números):</label>
        <input type="text" id="cep" placeholder="Ex: 01001000" onblur="buscarCepExterno()">
    </div>
    
    <div class="form-group">
        <label for="logradouro">Logradouro:</label>
        <input type="text" id="logradouro" readonly>
    </div>
    
    <div class="form-group">
        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" readonly>
    </div>
    
    <div class="form-group">
        <label for="localidade">Cidade:</label>
        <input type="text" id="localidade" readonly>
    </div>
    
    <div class="form-group">
        <label for="uf">UF:</label>
        <input type="text" id="uf" readonly>
    </div>

    <button onclick="salvarNoBanco()">Salvar no Banco</button>

    <h3>📋 Endereços Salvos</h3>
    <table id="tabelaEnderecos">
        <thead>
            <tr>
                <th>CEP</th>
                <th>Logradouro</th>
                <th>Cidade/UF</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dados inseridos via JavaScript dinamicamente -->
        </tbody>
    </table>
</div>

<script src="app.js"></script>
</body>
</html>
